name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # The upstream project has no declared license, and a fork cannot
          # legally assign one on the original author's behalf.
          ignore: "issues topics license"
