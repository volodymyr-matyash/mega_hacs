name: Home Assistant compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Home Assistant and test tools
        run: >-
          python -m pip install
          homeassistant==2026.8.2
          beautifulsoup4==4.13.3
          lxml==6.1.1
          pytest==9.1.1
          pytest-asyncio==1.4.0
          ruff==0.16.0

      - name: Compile integration
        run: python -m compileall -q custom_components/mega tests

      - name: Check for blocking Python errors
        run: ruff check --select E9,F63,F7,F82 custom_components/mega tests

      - name: Run compatibility tests
        run: python -m pytest -q tests/test_compatibility.py
